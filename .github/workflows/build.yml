name: Build and release Loop Dots APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate persistent signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LOOP_DOTS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LOOP_DOTS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOOP_DOTS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LOOP_DOTS_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Signing secrets missing. Set LOOP_DOTS_KEYSTORE_BASE64, LOOP_DOTS_STORE_PASSWORD, LOOP_DOTS_KEY_ALIAS and LOOP_DOTS_KEY_PASSWORD in repository Actions secrets before publishing an installable update."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/loopdots.keystore"
          keytool -list -keystore "$RUNNER_TEMP/loopdots.keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          LOOP_DOTS_KEYSTORE: ${{ runner.temp }}/loopdots.keystore
          LOOP_DOTS_KEY_ALIAS: ${{ secrets.LOOP_DOTS_KEY_ALIAS }}
          LOOP_DOTS_KEY_PASSWORD: ${{ secrets.LOOP_DOTS_KEY_PASSWORD }}
          LOOP_DOTS_STORE_PASSWORD: ${{ secrets.LOOP_DOTS_STORE_PASSWORD }}
        run: |
          gradle assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk LoopDots-v1.0.3.apk

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs LoopDots-v1.0.3.apk
          echo "APK_SHA256=$(sha256sum LoopDots-v1.0.3.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish direct APK via GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.3 LoopDots-v1.0.3.apk \
            --title "Loop Dots v1.0.3" \
            --notes "APK direto, sem ZIP. Assinado com a chave permanente configurada no GitHub. SHA256: $APK_SHA256. Se o aplicativo anterior tiver assinatura debug diferente, uma única reinstalação inicial será necessária." \
            --latest
