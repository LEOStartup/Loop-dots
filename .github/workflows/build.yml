name: Build and release Loop Dots APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Configure persistent debug signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LOOP_DOTS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/loopdots.keystore"
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
            echo "::warning::No signing secrets: distributing debug APK for testing only. Not compatible with older debug builds."
          fi
      - name: Build APK
        env:
          LOOP_DOTS_KEYSTORE: ${{ runner.temp }}/loopdots.keystore
          LOOP_DOTS_KEY_ALIAS: ${{ secrets.LOOP_DOTS_KEY_ALIAS }}
          LOOP_DOTS_KEY_PASSWORD: ${{ secrets.LOOP_DOTS_KEY_PASSWORD }}
          LOOP_DOTS_STORE_PASSWORD: ${{ secrets.LOOP_DOTS_STORE_PASSWORD }}
        run: |
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            gradle assembleRelease
            cp app/build/outputs/apk/release/app-release.apk LoopDots-v2.0.apk
          else
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk LoopDots-v2.0-test.apk
          fi
      - name: Upload ZIP artifact as fallback
        uses: actions/upload-artifact@v4
        with:
          name: loop-dots-apk
          path: LoopDots-*.apk
      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main' && env.HAS_RELEASE_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0 LoopDots-v2.0.apk --title "Loop Dots v2.0" --notes "Widget horizontal com lista vertical de hábitos, aparência configurável e assinatura persistente." --latest || gh release upload v2.0 LoopDots-v2.0.apk --clobber
