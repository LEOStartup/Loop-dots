plugins { id 'com.android.application' }

android {
    namespace 'com.leostartup.loopdots'
    compileSdk 35

    defaultConfig {
        // Retain the application ID so this build updates the currently installed widget.
        applicationId 'com.leostartup.loopdots.v2'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }
}
