plugins { id 'com.android.application' }

android {
    namespace 'com.leostartup.loopdots'
    compileSdk 35

    defaultConfig {
        // New application ID avoids signature conflicts with the older debug APK.
        applicationId 'com.leostartup.loopdots.v2'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
}
