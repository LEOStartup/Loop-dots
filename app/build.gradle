plugins { id 'com.android.application' }

android {
    namespace 'com.leostartup.loopdots'
    compileSdk 35

    signingConfigs {
        persistent {
            def ks = System.getenv('LOOP_DOTS_KEYSTORE')
            if (ks != null && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('LOOP_DOTS_STORE_PASSWORD')
                keyAlias System.getenv('LOOP_DOTS_KEY_ALIAS')
                keyPassword System.getenv('LOOP_DOTS_KEY_PASSWORD')
            }
        }
    }
    defaultConfig {
        applicationId 'com.leostartup.loopdots.v2'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '1.0.8'
    }
    buildTypes {
        release {
            if (System.getenv('LOOP_DOTS_KEYSTORE') != null &&
                    file(System.getenv('LOOP_DOTS_KEYSTORE')).exists()) {
                signingConfig signingConfigs.persistent
            }
        }
    }
}

android.testOptions.unitTests.includeAndroidResources = true

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
