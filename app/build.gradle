plugins { id 'com.android.application' }

android {
    namespace 'com.leostartup.loopdots'
    compileSdk 35
    defaultConfig {
        // Keep the installed app ID. Debug APK upgrades require the same signing key.
        applicationId 'com.leostartup.loopdots.v2'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '2.0'
    }
}
